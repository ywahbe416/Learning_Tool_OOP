              - paragraph [ref=e73]:
                - strong [ref=e74]: Big-O
                - text: describes how an algorithm's time (or space) grows as input size
                - code [ref=e75]: "`n`"
                - text: grows. We keep the
                - strong [ref=e76]: largest term
                - text: and drop constants — we care about the shape, not the exact number.
              - code [ref=e78]: O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(2ⁿ) fastest slowest
              - paragraph [ref=e79]: "| Complexity | Name | Example | |---|---|---| | O(1) | Constant | Array access, HashMap get | | O(log n) | Logarithmic | Binary search, BST operations | | O(n) | Linear | Linear search, single loop | | O(n log n) | Linearithmic | Merge sort, heap sort | | O(n²) | Quadratic | Bubble sort, nested loops | | O(2ⁿ) | Exponential | Naive Fibonacci, subsets |"
              - paragraph [ref=e80]:
                - strong [ref=e81]: "Rule:"
                - text: Always analyze the
                - strong [ref=e82]: worst case
                - text: unless specified otherwise.
              - code [ref=e84]: "// O(1) — constant time regardless of array size public static int getFirst(int[] arr) { return arr[0]; } // O(n) — grows linearly with input public static int findMax(int[] arr) { int max = arr[0]; for (int x : arr) if (x > max) max = x; return max; } // O(n²) — nested loops public static boolean hasDuplicate(int[] arr) { for (int i = 0; i < arr.length; i++) for (int j = i + 1; j < arr.length; j++) if (arr[i] == arr[j]) return true; return false; }"
