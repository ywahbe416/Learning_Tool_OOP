              - paragraph [ref=e88]: Check each element one by one. Works on any array (sorted or unsorted).
              - code [ref=e90]: "public static int linearSearch(int[] arr, int target) { for (int i = 0; i < arr.length; i++) { if (arr[i] == target) return i; } return -1; }"
              - heading "Binary Search — O(log n)" [level=3] [ref=e91]
              - paragraph [ref=e92]:
                - text: Only works on a
                - strong [ref=e93]: sorted
                - text: array. Halve the search space at each step.
              - code [ref=e95]: "public static int binarySearch(int[] arr, int target) { int low = 0, high = arr.length - 1; while (low <= high) { int mid = (low + high) / 2; if (arr[mid] == target) return mid; if (arr[mid] < target) low = mid + 1; else high = mid - 1; } return -1; }"
              - paragraph [ref=e96]: "Searching 1,000,000 elements: linear = up to 1,000,000 checks; binary = at most 20."
