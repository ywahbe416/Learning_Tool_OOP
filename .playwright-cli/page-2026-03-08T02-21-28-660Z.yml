              - heading "Sorting" [level=2] [ref=e98]
              - paragraph [ref=e99]: "| Algorithm | Best | Average | Worst | Space | Stable? | |---|---|---|---|---|---| | Bubble Sort | O(n) | O(n²) | O(n²) | O(1) | Yes | | Insertion Sort | O(n) | O(n²) | O(n²) | O(1) | Yes | | Selection Sort | O(n²) | O(n²) | O(n²) | O(1) | No | | Merge Sort | O(n log n) | O(n log n) | O(n log n) | O(n) | Yes | | Quick Sort | O(n log n) | O(n log n) | O(n²) | O(log n) | No |"
              - paragraph [ref=e100]:
                - strong [ref=e101]: Merge Sort
                - text: — divide, sort each half, merge. Guaranteed O(n log n).
              - code [ref=e103]: "public static int[] mergeSort(int[] arr) { if (arr.length <= 1) return arr; int mid = arr.length / 2; int[] left = mergeSort(Arrays.copyOfRange(arr, 0, mid)); int[] right = mergeSort(Arrays.copyOfRange(arr, mid, arr.length)); return merge(left, right); } private static int[] merge(int[] left, int[] right) { int[] result = new int[left.length + right.length]; int i = 0, j = 0, k = 0; while (i < left.length && j < right.length) { if (left[i] <= right[j]) result[k++] = left[i++]; else result[k++] = right[j++]; } while (i < left.length) result[k++] = left[i++]; while (j < right.length) result[k++] = right[j++]; return result; }"
