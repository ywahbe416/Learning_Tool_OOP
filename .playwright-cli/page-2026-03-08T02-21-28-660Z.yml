              - paragraph [ref=e116]:
                - text: Maintain a
                - strong [ref=e117]: window
                - text: (subarray/substring) that slides over the input. Avoids recomputing from scratch at each position — O(n) instead of O(n²).
              - paragraph [ref=e118]:
                - strong [ref=e119]: "Classic: Maximum sum subarray of size k"
              - code [ref=e121]: "public static int maxWindowSum(int[] arr, int k) { int windowSum = 0; for (int i = 0; i < k; i++) windowSum += arr[i]; // first window int maxSum = windowSum; for (int i = k; i < arr.length; i++) { windowSum += arr[i] - arr[i - k]; // slide: add new, remove old maxSum = Math.max(maxSum, windowSum); } return maxSum; } // maxWindowSum(new int[]{2,1,5,1,3,2}, 3) → 9 (5+1+3)"
