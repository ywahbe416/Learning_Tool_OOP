              - code [ref=e111]: "public static int[] twoSumSorted(int[] arr, int target) { int left = 0, right = arr.length - 1; while (left < right) { int sum = arr[left] + arr[right]; if (sum == target) return new int[]{left, right}; if (sum < target) left++; // need bigger sum else right--; // need smaller sum } return new int[]{}; } // twoSumSorted(new int[]{1,2,3,4,6}, 6) → [1, 3] (indices of 2 and 4)"
