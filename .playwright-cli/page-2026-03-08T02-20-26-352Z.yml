                - text: .
              - code [ref=e133]: "public class Point { int x, y; public Point(int x, int y) { this.x = x; this.y = y; } @Override public String toString() { return \"Point(\" + x + \", \" + y + \")\"; } } Point p = new Point(3, 4); System.out.println(p); // \"Point(3, 4)\" System.out.println(\"At: \" + p); // \"At: Point(3, 4)\""
              - paragraph [ref=e134]:
                - text: Every class inherits
                - code [ref=e135]: "`toString()`"
                - text: from the
