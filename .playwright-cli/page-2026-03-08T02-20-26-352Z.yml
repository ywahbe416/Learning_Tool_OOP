              - heading "Class" [level=2] [ref=e79]
              - paragraph [ref=e80]:
                - text: A
                - strong [ref=e81]: class
                - text: is the blueprint — it defines what attributes (data) and methods (behavior) an object will have. It does not hold data itself; it describes the shape of the data.
              - code [ref=e83]: "public class Car { String make; String model; int year; public Car(String make, String model, int year) { this.make = make; this.model = model; this.year = year; } public String describe() { return year + \" \" + make + \" \" + model; } }"
              - paragraph [ref=e84]: Think of a class like an architectural blueprint. The blueprint isn't a house — it's the instructions for building one.
              - separator [ref=e85]
              - heading "Object" [level=2] [ref=e86]
              - paragraph [ref=e87]:
                - text: An
                - strong [ref=e88]: object
                - text: is a specific
                - strong [ref=e89]: instance
                - text: created from a class. You can create many objects from the same class, each with its own data.
              - code [ref=e91]: Car car1 = new Car("Toyota", "Camry", 2022); Car car2 = new Car("Honda", "Civic", 2023); System.out.println(car1.describe()); // "2022 Toyota Camry" System.out.println(car2.describe()); // "2023 Honda Civic"
              - paragraph [ref=e92]:
                - code [ref=e93]: "`car1`"
                - text: and
                - code [ref=e94]: "`car2`"
                - text: are two separate objects — two houses built from the same blueprint.
              - separator [ref=e95]
              - heading "Constructor" [level=2] [ref=e96]
              - paragraph [ref=e97]:
                - text: The
                - strong [ref=e98]: constructor
                - text: is a special method that runs automatically when you create an object with
                - code [ref=e99]: "`new`"
                - text: . Its job is to
                - strong [ref=e100]: initialize
                - text: the object's fields with starting values.
              - code [ref=e102]: "public class Student { String name; // instance field double gpa; // instance field public Student(String name, double gpa) { this.name = name; this.gpa = gpa; } } Student s = new Student(\"Alex\", 3.8); System.out.println(s.name); // \"Alex\""
              - paragraph [ref=e103]: "Key rules:"
              - list [ref=e104]:
                - listitem [ref=e105]:
                  - text: The constructor always has the
                  - strong [ref=e106]: same name as the class
                - listitem [ref=e107]:
                  - text: It has
                  - strong [ref=e108]: no return type
                  - text: (not even
                  - code [ref=e109]: "`void`"
                  - text: )
                - listitem [ref=e110]: If you don't define one, a default no-argument constructor is provided
              - separator [ref=e111]
              - heading "Encapsulation" [level=2] [ref=e112]
              - paragraph [ref=e113]:
                - strong [ref=e114]: Encapsulation
                - text: means bundling data (fields) and the methods that operate on that data together inside a class — and
                - strong [ref=e115]: hiding
                - text: the internal state from the outside world.
              - paragraph [ref=e116]:
                - text: "The practice: make fields"
                - strong [ref=e117]: private
                - text: ", expose them only through"
                - strong [ref=e118]: public getters and setters
                - text: .
              - code [ref=e120]: "public class BankAccount { private String owner; // private field private double balance; // private field public BankAccount(String owner, double initialBalance) { this.owner = owner; this.balance = initialBalance; } public double getBalance() { return balance; } public void deposit(double amount) { if (amount > 0) balance += amount; } public void withdraw(double amount) { if (amount > balance) throw new IllegalArgumentException(\"Insufficient funds\"); balance -= amount; } } BankAccount acct = new BankAccount(\"Alice\", 500.0); acct.deposit(200.0); System.out.println(acct.getBalance()); // 700.0 // acct.balance = 99999; // ERROR — private!"
              - paragraph [ref=e121]:
                - strong [ref=e122]: Why encapsulate?
              - list [ref=e123]:
                - listitem [ref=e124]: Protects data from being set to invalid states
                - listitem [ref=e125]: You can change the internal implementation without breaking outside code
