              - paragraph [ref=e73]:
                - text: OOP is a programming paradigm that organizes code around
                - strong [ref=e74]: objects
                - text: "rather than functions and logic. The four pillars are: Encapsulation, Inheritance, Polymorphism, and Abstraction."
              - paragraph [ref=e75]:
                - text: "Everything in OOP starts with two fundamental concepts:"
                - strong [ref=e76]: classes
                - text: and
