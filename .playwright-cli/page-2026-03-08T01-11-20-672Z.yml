              - blockquote [ref=e68]:
                - paragraph [ref=e69]: "In this lesson: learn how classes become objects, how constructors initialize state, and why encapsulation protects data."
                - paragraph [ref=e70]: Use the lab to compare blueprint vs instance state, then complete the coding challenge to build the same behavior in Java.
              - heading "What is Object-Oriented Programming?" [level=2] [ref=e71]
              - paragraph [ref=e72]:
                - text: OOP is a programming paradigm that organizes code around
                - strong [ref=e73]: objects
                - text: "rather than functions and logic. The four pillars are: Encapsulation, Inheritance, Polymorphism, and Abstraction."
              - paragraph [ref=e74]:
                - text: "Everything in OOP starts with two fundamental concepts:"
                - strong [ref=e75]: classes
                - text: and
                - strong [ref=e76]: objects
                - text: .
              - separator [ref=e77]
              - heading "Class" [level=2] [ref=e78]
              - paragraph [ref=e79]:
                - text: A
                - strong [ref=e80]: class
                - text: is the blueprint — it defines what attributes (data) and methods (behavior) an object will have. It does not hold data itself; it describes the shape of the data.
              - code [ref=e82]: "public class Car { String make; String model; int year; public Car(String make, String model, int year) { this.make = make; this.model = model; this.year = year; } public String describe() { return year + \" \" + make + \" \" + model; } }"
              - paragraph [ref=e83]: Think of a class like an architectural blueprint. The blueprint isn't a house — it's the instructions for building one.
              - separator [ref=e84]
              - heading "Object" [level=2] [ref=e85]
              - paragraph [ref=e86]:
                - text: An
                - strong [ref=e87]: object
                - text: is a specific
                - strong [ref=e88]: instance
                - text: created from a class. You can create many objects from the same class, each with its own data.
              - code [ref=e90]: Car car1 = new Car("Toyota", "Camry", 2022); Car car2 = new Car("Honda", "Civic", 2023); System.out.println(car1.describe()); // "2022 Toyota Camry" System.out.println(car2.describe()); // "2023 Honda Civic"
              - paragraph [ref=e91]:
                - code [ref=e92]: "`car1`"
                - text: and
                - code [ref=e93]: "`car2`"
                - text: are two separate objects — two houses built from the same blueprint.
              - separator [ref=e94]
              - heading "Constructor" [level=2] [ref=e95]
              - paragraph [ref=e96]:
                - text: The
                - strong [ref=e97]: constructor
                - text: is a special method that runs automatically when you create an object with
                - code [ref=e98]: "`new`"
                - text: . Its job is to
                - strong [ref=e99]: initialize
                - text: the object's fields with starting values.
              - code [ref=e101]: "public class Student { String name; // instance field double gpa; // instance field public Student(String name, double gpa) { this.name = name; this.gpa = gpa; } } Student s = new Student(\"Alex\", 3.8); System.out.println(s.name); // \"Alex\""
              - paragraph [ref=e102]: "Key rules:"
              - list [ref=e103]:
                - listitem [ref=e104]:
                  - text: The constructor always has the
                  - strong [ref=e105]: same name as the class
                - listitem [ref=e106]:
                  - text: It has
                  - strong [ref=e107]: no return type
                  - text: (not even
                  - code [ref=e108]: "`void`"
                  - text: )
                - listitem [ref=e109]: If you don't define one, a default no-argument constructor is provided
              - separator [ref=e110]
              - heading "Encapsulation" [level=2] [ref=e111]
              - paragraph [ref=e112]:
                - strong [ref=e113]: Encapsulation
                - text: means bundling data (fields) and the methods that operate on that data together inside a class — and
                - strong [ref=e114]: hiding
                - text: the internal state from the outside world.
              - paragraph [ref=e115]:
                - text: "The practice: make fields"
                - strong [ref=e116]: private
                - text: ", expose them only through"
                - strong [ref=e117]: public getters and setters
                - text: .
              - code [ref=e119]: "public class BankAccount { private String owner; // private field private double balance; // private field public BankAccount(String owner, double initialBalance) { this.owner = owner; this.balance = initialBalance; } public double getBalance() { return balance; } public void deposit(double amount) { if (amount > 0) balance += amount; } public void withdraw(double amount) { if (amount > balance) throw new IllegalArgumentException(\"Insufficient funds\"); balance -= amount; } } BankAccount acct = new BankAccount(\"Alice\", 500.0); acct.deposit(200.0); System.out.println(acct.getBalance()); // 700.0 // acct.balance = 99999; // ERROR — private!"
              - paragraph [ref=e120]:
                - strong [ref=e121]: Why encapsulate?
              - list [ref=e122]:
                - listitem [ref=e123]: Protects data from being set to invalid states
                - listitem [ref=e124]: You can change the internal implementation without breaking outside code
              - separator [ref=e125]
              - heading "toString()" [level=2] [ref=e126]
              - paragraph [ref=e127]:
                - code [ref=e128]: "`toString()`"
                - text: is a special method that returns a
                - strong [ref=e129]: string representation
                - text: of an object. It's called automatically when you print an object with
                - code [ref=e130]: "`System.out.println()`"
                - text: .
              - code [ref=e132]: "public class Point { int x, y; public Point(int x, int y) { this.x = x; this.y = y; } @Override public String toString() { return \"Point(\" + x + \", \" + y + \")\"; } } Point p = new Point(3, 4); System.out.println(p); // \"Point(3, 4)\" System.out.println(\"At: \" + p); // \"At: Point(3, 4)\""
              - paragraph [ref=e133]:
                - text: Every class inherits
                - code [ref=e134]: "`toString()`"
                - text: from the
                - code [ref=e135]: "`Object`"
                - text: class. Without overriding it, you'd get something like
                - code [ref=e136]: "`Point@1b6d3586`"
                - text: — the memory address. Always override it.
